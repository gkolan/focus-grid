name: Bug report
description: Report behaviour that differs from the documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Use demo mode or made-up tasks. Do not include API keys, bot tokens,
        exported task files, or screenshots of real task data.
  - type: input
    id: commit
    attributes:
      label: Commit SHA
      placeholder: full SHA from git rev-parse HEAD
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node and npm versions, browser and version, operating system.
      placeholder: Node 24.x, npm 11.x; Chrome 140; Windows 11
    validations:
      required: true
  - type: dropdown
    id: demo
    attributes:
      label: Reproduces in demo mode (/?demo=1)?
      options:
        - "Yes"
        - "No"
        - Not tried
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Link the guide in docs/ that describes it, if one does.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Grid
        - Focus
        - Calendar
        - Tasks / Inbox / editor
        - Priority engine
        - Backup / import
        - Notifications / push
        - Offline / PWA
        - AI capture / assistant / Telegram
        - Settings
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data handling
      options:
        - label: I removed API keys, tokens, and real task data from this report.
          required: true
