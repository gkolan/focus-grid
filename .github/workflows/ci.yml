name: Project checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  project-checks:
    name: Lint, typecheck, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install project tools
        run: npm ci

      - name: Lint (including domain boundary rules)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest suites
        run: npm test
